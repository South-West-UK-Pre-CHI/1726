- role: Device Prototypin’ Summer School
  image: /assets/images/opportunities/summer-school.png
  summary: Mark yer calendars, me hearties! From the 14th to the 17th o’ July, set sail fer Lancaster University fer the third annual Device Prototypin’ Summer School. Sharpen yer skills in digital device design, takin’ yer prototype from a wee sketch to somethin’ fit fer plunderin’ the high seas o’ tech. Ye’ll get yer hands on the finest university labs and learn from the world’s top experts in electronic device makin’.
  event-details:
    - Ye can grab subsidised spots, includin’ bunkin’, grub, and all the course booty fer just £100. And our prize contest returns to reward the most fearsome and clever prototypes turned into real treasures.
    - Applications open soon in April! Join the pro² crew fer free at <a href="https://www.prosquared.org" target="_blank">prosquared.org</a>, and follow us on <a href="https://www.linkedin.com/company/prosquaredplus" target="_blank">LinkedIn</a>, <a href="https://bsky.app/profile/prosquared.org" target="_blank">BlueSky</a>, and <a href="https://www.instagram.com/prosquared.plus/" target="_blank">Instagram</a> to keep yer spyglass on all the updates.
  website: https://prosquared.org/join/
  website-text: Join the pro² crew
  linkedin: https://www.linkedin.com/company/prosquaredplus
  bluesky: https://bsky.app/profile/prosquared.org
  instagram: https://www.instagram.com/prosquared.plus/

- role: Pro² Be Hiring!
  image: /assets/images/opportunities/pro2-hiring.png
  summary: We be huntin’ fer a seasoned Development Specialist who be mad fer open source! If ye fit the bill, hoist yer application by the 11th o’ March 2026.
  responsibilities:
    - Command the front-end deck, settin’ the course fer architecture, performance, accessibility, and developer ease.
    - Forge modern, reusable components and patterns, evolvin’ the software as our ship and crew grow.
    - Master the full tech stack, includin’ Python and Django, so ye can swab bugs, extend features, and keep the system shipshape end-to-end.
    - Use open-source practices and tools (release notes, READMEs, issue trackin’, discussions) to make the project friendly fer new hands and old salts alike.
    - Parley with developer crews via forums, social channels, live streams, and meet-ups, turnin’ feedback into improvements and keepin’ contributors and users engaged.
  website: https://www.bristol.ac.uk/jobs/find/details/?nPostingId=200995&nPostingTargetId=385637&id=Q50FK026203F3VBQBV7V77V83&LG=UK&languageSelect=UK&mask=newuobext

- role: Pro² Treasure Be Available
  image: /assets/images/opportunities/pro2-funding.png
  summary: The pro² Residency Scheme be open on a rolling basis to support international and industrial residencies that help folks craft digital devices in small numbers. These residencies aim to forge long-lashin’ partnerships ‘tween academia and industry.
  website: https://prosquared.org/the-pro2-residency-scheme/

- role: Pro² CHI Workshop
  image: /assets/images/opportunities/pro2-chi.png
  summary: The pro² crew be sailin’ to this year’s CHI and hostin’ a workshop called ‘Are We Doin’ Enough? Sharin’ Design and Manufacturin’ Expertise Across Open Source Hardware Communities’. The application window be closed, but we’d love to meet ye if ye be attendin’.
  website: https://are-we-doing-enough-workshop.github.io/
  website-text: CHI Workshop

